name: PR title

# main only takes squash merges, and the squash commit is the PR title with an
# empty body. That title is the Conventional Commit release-please reads, so it
# is checked here; commits on the branch stay free-form. CONTRIBUTING.md has
# the rules.

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            chore
            ci
            build
            revert
          scopes: |
            widget
            helper
            bar-leds
            spec
            ci
            deps
            release
          requireScope: false
          # Lowercase imperative subject, no trailing period.
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start lowercase and not end with a period.

  parent-issue:
    name: parent issue stays open
    # #1 is the parent of every slice and closes only by hand. A PR closes it by
    # accident in two ways, both seen: a branch created with `gh issue develop 1`
    # (#16), or "close/fix/resolve" written directly before its number anywhere
    # in the description (#20). GitHub lists both in closingIssuesReferences.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the issues this PR would close
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PARENT: '1'
        run: |
          closes=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number')
          echo "This PR closes: ${closes:-nothing}"
          if printf '%s\n' "$closes" | grep -qx "$PARENT"; then
            echo "::error::Merging this PR would close the parent issue #$PARENT. Use a plain branch and write 'Refs #$PARENT'; keep close/fix/resolve away from its number."
            exit 1
          fi
