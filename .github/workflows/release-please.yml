name: Release Please

# On every push to main, release-please reads the Conventional Commits since the
# last release and keeps one release PR open with the next version, the
# generated CHANGELOG.md section and the bumped manifest.json `version`.
# Merging that PR tags vX.Y.Z and publishes the GitHub Release.
#
# It uses GITHUB_TOKEN. CI and the PR-title check do run on the release PR, but
# GitHub holds them as "awaiting approval" because the bot opened it (seen on
# #18): a maintainer clicks "Approve and run" before merging, so the validator
# checks the bumped manifest.json. The release PR only touches CHANGELOG.md,
# manifest.json's version and the release manifest.
#
# Needs the repo setting "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
