; qmllint settings for scripts/qmllint.sh, which fails on any warning.
; Every entry here relaxes one category and says why.

[Warnings]
; Omarchy's Commons singletons group their values in nested QtObjects
; (Style.bar.iconSlot, Color.popups.background). qmllint types those as
; plain QObject and cannot see their members, so every idiomatic Omarchy
; lookup would warn. Reported as info instead of failing the run.
MissingProperty=info
